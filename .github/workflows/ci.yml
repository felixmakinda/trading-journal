name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build can run; real values live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database-and-e2e:
    name: Migrations, RLS tests, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (applies every migration and the demo seed)
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime,mailpit,postgres-meta
      - name: Lint database schema
        run: pnpm exec supabase db lint --level warning
      - name: Row Level Security and MFA tests
        run: pnpm exec supabase test db
      - name: Generated types are up to date
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/types.ts
          diff -u apps/web/src/lib/supabase/database.types.ts /tmp/types.ts
      - name: Write local environment
        run: |
          eval "$(pnpm exec supabase status -o env)"
          cat > apps/web/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$SECRET_KEY
          APP_URL=http://localhost:3000
          TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SYNC_SECRET=$(openssl rand -hex 32)
          EOF
      - run: pnpm --filter @tj/web build
      - run: pnpm --filter @tj/web exec playwright install --with-deps chromium
      - run: pnpm --filter @tj/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high
